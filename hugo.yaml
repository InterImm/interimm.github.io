baseURL: "https://interimm.org/"
title: "星际移民中心"

defaultContentLanguage: cn
defaultContentLanguageInSubdir: false

enableRobotsTXT: true
enableEmoji: true

# No blog/taxonomies on this site, so no feeds or term pages to generate.
disableKinds:
  - RSS
  - taxonomy
  - term

markup:
  goldmark:
    renderer:
      unsafe: true # content embeds small HTML snippets (video, iframes)

# Analytics: the old Universal Analytics property (UA-50146153-1) stopped
# collecting data in July 2023. To turn analytics back on, create a GA4
# property and uncomment this. The layout only emits the tag in production
# builds and when an id is set.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

params:
  author: InterImm
  github: interimm
  # Default social-sharing image (pages can override with `images:` in front matter).
  images:
    - /images/about/interimm_banner_black.png

languages:
  cn:
    languageCode: zh-CN
    languageName: 中文
    weight: 1
    contentDir: content/cn
    title: 星际移民中心
    params:
      description: "星际移民中心直属"
      splash: /images/home/undraw_Taken_if77.svg
      tags:
        - 星际开发研究
        - 火星移民服务
      primary_button:
        title: 欢迎登船
        link: /archives/
    menus:
      main:
        - identifier: archives
          name: 档案馆
          weight: 10
        - identifier: archives-all
          name: 全部档案
          parent: archives
          pageRef: /archives
          weight: 1
        - identifier: archives-book
