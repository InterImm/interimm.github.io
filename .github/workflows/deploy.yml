name: Deploy Website

# Builds the Hugo site and publishes it with GitHub Pages' official deployment
# action. Pull requests only verify that the site builds.
#
# One-time repo setting: Settings > Pages > Build and deployment > Source must
# be "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches:
      - hugo
  pull_request:
    branches:
      - hugo
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is already running; superseded pull request
# builds are cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.135.0'

      - name: Build
        run: hugo --minify --gc

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
