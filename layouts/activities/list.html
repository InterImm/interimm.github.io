{{ define "main" }}
{{- $d := index site.Data.activities site.Language.Lang -}}
{{ partial "page-hero.html" (dict "title" $d.title "description" $d.description "kicker" (i18n "org_name")) }}
<div class="section section-flush">
  <div class="wrap doc-grid">
    <div class="doc-side"><p class="kicker">{{ i18n "log_columns" }}</p></div>
    <div class="doc-main">
      {{ partial "activity-log.html" (dict "list" $d.list) }}
    </div>
  </div>
</div>
{{ end }}
