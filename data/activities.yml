cn:
  title: "更新"
  description: "星际移民中心的活动记录"
  list:
    - title: 太阳系星港上线
      description: 实时星图上查询行星之间的航线、发射窗口、航程、运价和信号延时，并领取登机牌；运价以星际移民中心的货币“脉”（MC）计
      datetime: "2026-10-04"
      icon: "☀️"
      link: https://interimm.org/solar-port/
    - title: 星际企业中心改版
      description: 在火星找工作、登记星际企业，并在企业办公室里管理招聘、广告和公告
      datetime: "2026-10-04"
      icon: "🏢"
      link: https://interimm.org/hub/
    - title: 星际移民之书改版
      description: 新的版式，支持浅色和深色模式，各章附有开篇动画短片
      datetime: "2026-10-04"
      icon: "📖"
      link: https://book.interimm.org/
    - title: 火星地图改版
      description: 新的版式和中英文页面，标出火星城市、阿玛宗共和国和历史着陆遗址
      datetime: "2026-10-04"
      icon: "🗺️"
      link: https://interimm.org/mars-map/
    - title: 火星开放设施
      description: 火星殖民地的七座关键工厂实时运行，每小时更新产量和库存
      datetime: "2026-10-03"
      icon: "🏭"
      link: https://interimm.org/mars-open-facilities/
    - title: 火星时间服务
      description: 火星时钟改版，提供 JavaScript 库、免费的 JSON 数据接口和可嵌入的小组件
      datetime: "2026-10-03"
      icon: "🕒"
      link: https://interimm.org/mars-clock/
    - title: "星际物流：地火转移窗口规划器"
      description: 计算地球到火星的最低能耗转移窗口，并估算运价；完全在浏览器中运行（页面为英文）
      datetime: "2026-10-01"
      icon: "🚀"
      link: https://interimm.org/interplanetary-logistics/
    - title: "星际物流 API"
      description: 星际物流提供了可以用来计算太阳系内物流的 API
      datetime: "2019-12-08"
      icon: "🚀"
      link: https://github.com/InterImm/interplanetary-logistics/tree/python-api
    - title: 火星地球通信延时计算工具
      description: 计算太阳系内任意行星之间任意时刻的通信延时
      datetime: "2019-03-29"
      icon: "📡"
      link: https://interimm.org/comms-latency
    - title: 行星大学网站建立
      description: 成立行星大学，设立研究部门
      datetime: "2018-04-06"
      icon: "🎓"
      link: https://planiversity.interimm.org/
    - title: 空间站读书计划
      description: 阅读空间站相关的书籍：通过 Skype 实现
      datetime: "2016-06"
      icon: "🛰️"
      link: https://github.com/InterImm/space-settlement
    - title: 集智年会报告：人类星际移民
      description: 通过 Skype 实现
      datetime: "2015-07-25 09:30"
      icon: "🎤"
      link: http://computational-communication.com/post/guan-yu-wo-men/2015-05-09-anual-symposium
    - title: 20 期星际圆桌
      description: 定期的系列圆桌讨论
      datetime: "2014-07-26 to 2018-09-16"
      icon: "💬"
      link: https://github.com/InterImm/roundTable/issues/4

