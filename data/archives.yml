cn:
  title: "档案馆"
  description: "火星档案馆是太阳系文明最重要的档案机构"
  list:
    - title: 星际移民之书
      description: 人类建立太阳系文明的曲折历史以及所发展的科技，各章附有开篇动画短片
      icon: "📖"
      button: 开始阅读
      link: https://book.interimm.org/
    - title: 系外行星文档
      description: 系外行星的数据和特征，行星形成理论，以及系外生命
      icon: "🪐"
      button: 开始阅读
      link: https://exoplanets.interimm.org/
    - title: 太阳系星港
      description: 实时星图显示行星此刻的位置；选两颗行星，查询下一个发射窗口、航程、运价（脉）和信号延时，然后领取登机牌
      icon: "☀️"
      button: 查询航线
      link: https://interimm.org/solar-port/
    - title: 火星城市
      description: 在真实的火星阳光下以 3D 探索火星城市，并查看城市设施的实时读数
      icon: "🏙️"
      button: 查看
      link: https://cities.interimm.org/?lang=cn
    - title: 火星开放设施
      description: 火星殖民地的关键工厂实时运行：推进剂、能源、空气、钢铁、水和食物；每小时更新（页面为英文）
      icon: "🏭"
      button: 查看
      link: https://interimm.org/mars-open-facilities/
    - title: 火星地图
      description: 火星城市、阿玛宗共和国和历史着陆遗址，叠加在 MOLA 海拔图上的互动地图
      icon: "🗺️"
      button: 使用地图
      link: https://interimm.org/mars-map/
    - title: 火星时钟
      description: 火星现在几点？协调火星时、火星季节、星际移民中心的历法与时区、地火时间换算，以及免费的数据接口和可嵌入的小组件
      icon: "🕒"
      button: 查看时间
      link: https://interimm.org/mars-clock/
    - title: 星际企业中心
      description: 在火星找工作，登记你自己的星际企业，并在企业办公室里发布招聘、广告和公告
      icon: "🏢"
      button: 查看和登记
      link: https://interimm.org/hub/
    - title: 星际物流
      description: 计算地球到火星的最低能耗转移窗口，并估算运价；完全在浏览器中运行（页面为英文）
      icon: "🚀"
      button: 规划航线
      link: https://interimm.org/interplanetary-logistics/
    - title: 恒星网络
      description: 恒星际交通研究，建立恒星际交通网络
      icon: "⭐"
      button: 查看
      link: https://stellar.interimm.org/
    - title: 星际移民时间线
      description: 人类太空文明的历史时间线
      icon: "⏳"
      button: 查看
      link: https://timeline.interimm.org/
    - title: 地火通信延时
      description: 实时计算地球与火星之间的通信延时（早期工具，太阳系星港已涵盖所有行星）
      icon: "📡"
      button: 查看
      link: https://interimm.org/comms-latency/
    - title: 星际旅行登机牌
      description: 生成地火航班的登机牌（早期工具，太阳系星港查询航线后也可领取）
      icon: "🎫"
      button: 查看
      link: https://interimm.org/boarding-pass/
    - title: 人类火星探索地图
      description: 人类探索火星的互动地图
      icon: "🧭"
      button: 查看
      link: https://interimm.org/mars-exploration-map/

en:
  title: "Archives"
  description: "The Mars Interplanetary Archives"
  list:
    - title: The Book of Interplanetary Civilization
      description: A concise history of a cruel and inspiring era, with key events and technologies explained. Chapters open with short animated films.
      icon: "📖"
      button: Read Now
      link: https://book.interimm.org/
    - title: The Book of Exoplanets
      description: Observation of exoplanets, statistical analysis of them, formation and evolution of planets, life on exoplanets
      icon: "🪐"
      button: Read Now
      link: https://exoplanets.interimm.org/
    - title: Solar Port
      description: A live sky map of where the planets are right now. Pick two of them to see the next launch window, flight time, fare in MC and signal delay, then collect your boarding pass.
      icon: "☀️"
      button: Plan a Trip
      link: https://interimm.org/solar-port/en/
    - title: Cities on Mars
      description: Explore the Martian cities in 3D under the real Martian sun, with live readings from their facilities.
      icon: "🏙️"
      button: Explore
      link: https://cities.interimm.org/
    - title: Mars Open Facilities
      description: "The key plants of the Mars colonies, running live: propellant, power, air, iron, water and food. Updated every hour."
      icon: "🏭"
      button: View Live
      link: https://interimm.org/mars-open-facilities/
    - title: Map of Mars
      description: The Martian cities, the Republic of Amazonia and the historic landing sites on an interactive MOLA elevation map.
      icon: "🗺️"
      button: Use the Map
      link: https://interimm.org/mars-map/en/
    - title: Mars Clock
      description: What time is it on Mars? Coordinated Mars Time, the season, the InterImm calendar and timezones, an Earth–Mars converter, a free API and an embeddable widget.
      icon: "🕒"
      button: Check the Time
      link: https://interimm.org/mars-clock/en/
    - title: Company Hub
      description: Find work on Mars, register your own company and run its jobs, ads and notices from your Company Office.
      icon: "🏢"
      button: Browse and Register
      link: https://interimm.org/hub/en/
    - title: Interplanetary Logistics
      description: Find the cheapest Earth to Mars transfer window and price a shipment from its delta-v. Runs entirely in the browser.
      icon: "🚀"
      button: Plan a Route
      link: https://interimm.org/interplanetary-logistics/
    - title: Interstellar Transportation Network
      description: Research on network for interstellar transportations.
      icon: "⭐"
      button: Read Now
      link: https://stellar.interimm.org/
    - title: Timeline of Events
      description: A timeline tool for human space civilization
      icon: "⏳"
      button: Interact Now
      link: https://timeline.interimm.org/
    - title: Earth–Mars Communication Latency
      description: Calculate the Earth–Mars communication lag in real time. An early tool; the Solar Port now covers every planet.
      icon: "📡"
      button: Interact Now
      link: https://interimm.org/comms-latency/en/
    - title: Interplanetary Travel Boarding Pass
      description: Generate a boarding pass for an Earth–Mars flight. An early tool; the Solar Port also issues one after you plan a trip.
      icon: "🎫"
      button: Interact Now
      link: https://interimm.org/boarding-pass/en/
    - title: Mars Exploration Map
      description: Interactive map of human exploration of Mars
      icon: "🧭"
      button: Explore Now
      link: https://interimm.org/mars-exploration-map/
